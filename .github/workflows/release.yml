name: Build Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag in vMAJOR.MINOR.PATCH format
        required: true
        type: string
      ref:
        description: Git ref to build
        required: true
        default: main
        type: string
      release_notes:
        description: 面向用户的中文更新说明（必填；可使用多行内容）
        required: true
        type: string
      targets:
        description: 要构建的平台，逗号分隔，可选 linux、macos、windows
        required: false
        default: macos,windows
        type: string

permissions:
  contents: write

jobs:
  version:
    name: Validate release version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        name: Normalize release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must use vMAJOR.MINOR.PATCH format, such as v0.1.1." >&2
            exit 1
          fi

          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.os }} bundles
    if: ${{ contains(format(',{0},', inputs.targets), format(',{0},', matrix.artifact)) }}
    runs-on: ${{ matrix.os }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundles: deb,rpm
            artifact: linux
            path: |
              apps/app/src-tauri/target/release/bundle/deb/*.deb
              apps/app/src-tauri/target/release/bundle/rpm/*.rpm
          - os: macos-14
            bundles: dmg
            artifact: macos
            path: apps/app/src-tauri/target/release/bundle/dmg/*.dmg
          - os: windows-latest
            bundles: nsis
            artifact: windows
            path: apps/app/src-tauri/target/release/bundle/nsis/*-setup.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure bundle version
        shell: bash
        env:
          APP_VERSION: ${{ needs.version.outputs.version }}
        run: printf '{"version":"%s"}\n' "$APP_VERSION" > apps/app/src-tauri/tauri.release.conf.json

      - name: Build bundles
        run: pnpm --filter app exec tauri build --bundles "${{ matrix.bundles }}" --config src-tauri/tauri.release.conf.json

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: bluepen-${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [version, build]
    steps:
      - name: Checkout release ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Download bundles
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate Chinese release notes
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          RELEASE_REF: ${{ inputs.ref }}
          RELEASE_SUMMARY: ${{ inputs.release_notes }}
          RELEASE_TARGETS: ${{ inputs.targets }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail

          if ! printf '%s' "$RELEASE_SUMMARY" | python3 -c 'import sys; text = sys.stdin.read(); raise SystemExit(0 if any("\u3400" <= char <= "\u9fff" for char in text) else 1)'; then
            echo "Release notes must include a Chinese user-facing summary." >&2
            exit 1
          fi

          previous_tag=""
          while IFS= read -r candidate; do
            if [[ "$candidate" != "$RELEASE_TAG" ]] && [[ "$candidate" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              previous_tag="$candidate"
              break
            fi
          done < <(git tag --merged HEAD --sort=-version:refname)

          {
            printf '# Bluepen %s\n\n' "${RELEASE_TAG#v}"
            printf '## 更新说明\n\n%s\n\n' "$RELEASE_SUMMARY"
            printf '## 构建信息\n\n'
            printf '基于 [%s](%s/%s/commit/%s) 构建。\n\n' "$RELEASE_REF" "$SERVER_URL" "$REPOSITORY" "$(git rev-parse HEAD)"
            printf '## 安装包\n\n'
            case ",$RELEASE_TARGETS," in
              *,macos,*) printf '%s\n' '- macOS：`.dmg`' ;;
            esac
            case ",$RELEASE_TARGETS," in
              *,windows,*) printf '%s\n' '- Windows：`.exe`' ;;
            esac
            case ",$RELEASE_TARGETS," in
              *,linux,*) printf '%s\n' '- Linux：`.deb`、`.rpm`' ;;
            esac

            if [[ -n "$previous_tag" ]]; then
              printf '\n## 完整变更\n\n[查看 %s 到 %s 的完整变更](%s/%s/compare/%s...%s)\n' "$previous_tag" "$RELEASE_TAG" "$SERVER_URL" "$REPOSITORY" "$previous_tag" "$RELEASE_TAG"
            fi
          } > RELEASE_NOTES.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ inputs.ref }}
          files: release-assets/**/*
          fail_on_unmatched_files: true
          body_path: RELEASE_NOTES.md

name: Build Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag in vMAJOR.MINOR.PATCH format
        required: true
        type: string
      ref:
        description: Git ref to build
        required: true
        default: main
        type: string

permissions:
  contents: write

jobs:
  version:
    name: Validate release version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        name: Normalize release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must use vMAJOR.MINOR.PATCH format, such as v0.1.1." >&2
            exit 1
          fi

          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.os }} bundles
    runs-on: ${{ matrix.os }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundles: deb,rpm
            artifact: linux
            path: |
              apps/app/src-tauri/target/release/bundle/deb/*.deb
              apps/app/src-tauri/target/release/bundle/rpm/*.rpm
          - os: macos-14
            bundles: dmg
            artifact: macos
            path: apps/app/src-tauri/target/release/bundle/dmg/*.dmg
          - os: windows-latest
            bundles: nsis
            artifact: windows
            path: apps/app/src-tauri/target/release/bundle/nsis/*-setup.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure bundle version
        shell: bash
        env:
          APP_VERSION: ${{ needs.version.outputs.version }}
        run: printf '{"version":"%s"}\n' "$APP_VERSION" > apps/app/src-tauri/tauri.release.conf.json

      - name: Build bundles
        run: pnpm --filter app exec tauri build --bundles "${{ matrix.bundles }}" --config src-tauri/tauri.release.conf.json

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: bluepen-${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [version, build]
    steps:
      - name: Download bundles
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ inputs.ref }}
          files: release-assets/**/*
          fail_on_unmatched_files: true
          generate_release_notes: true

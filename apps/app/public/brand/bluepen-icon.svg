
<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Full-bleed background, 100% opaque to conform with macOS squircle dock standards -->
  <rect width="1024" height="1024" fill="#0A0A0A"/>

  <defs>
    <!-- Nothing Design Dot-Matrix Pattern (32px grid at 1024 scale = 16px at 512 scale) -->
    <pattern id="dot-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="1.5" fill="#333333" fill-opacity="0.6"/>
    </pattern>
    <!-- Soft Signal Red Glow behind active handle -->
    <radialGradient id="red-glow" cx="768" cy="256" r="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D71921" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#D71921" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#D71921" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Dot-matrix canvas texture -->
  <rect width="1024" height="1024" fill="url(#dot-grid)"/>

  <!-- Coordinate Corner Ticks -->
  <path d="M 100 130 L 130 130 M 130 100 L 130 130" stroke="white" stroke-opacity="0.28" stroke-width="3" stroke-linecap="square"/>
  <path d="M 924 130 L 894 130 M 894 100 L 894 130" stroke="white" stroke-opacity="0.28" stroke-width="3" stroke-linecap="square"/>
  <path d="M 100 894 L 130 894 M 130 924 L 130 894" stroke="white" stroke-opacity="0.28" stroke-width="3" stroke-linecap="square"/>
  <path d="M 924 894 L 894 894 M 894 924 L 894 894" stroke="white" stroke-opacity="0.28" stroke-width="3" stroke-linecap="square"/>

  <!-- Active Handle Signal Red Radial Glow -->
  <circle cx="768" cy="256" r="110" fill="url(#red-glow)"/>

  <!-- Main Square Bounding Frame (256, 256 to 768, 768) -->
  <rect x="256" y="256" width="512" height="512" rx="16" stroke="white" stroke-width="24"/>

  <!-- Secondary Dashed Diagonal (Top-Left to Bottom-Right) -->
  <line x1="256" y1="256" x2="768" y2="768" stroke="white" stroke-width="12" stroke-opacity="0.45" stroke-dasharray="16 12"/>

  <!-- Bold Primary Diagonal Vector Ray (Bottom-Left to Top-Right) -->
  <line x1="256" y1="768" x2="768" y2="256" stroke="white" stroke-width="24" stroke-linecap="round"/>

  <!-- Center Intersecting Precision Node -->
  <circle cx="512" cy="512" r="10" fill="white"/>

  <!-- 3 Standard Corner Handles -->
  <rect x="232" y="232" width="48" height="48" rx="6" fill="#0A0A0A" stroke="white" stroke-width="8"/>
  <rect x="232" y="744" width="48" height="48" rx="6" fill="#0A0A0A" stroke="white" stroke-width="8"/>
  <rect x="744" y="744" width="48" height="48" rx="6" fill="#0A0A0A" stroke="white" stroke-width="8"/>

  <!-- Top-Right Active Handle: Nothing Signature Red (#D71921) -->
  <rect x="744" y="232" width="48" height="48" rx="6" fill="#D71921" stroke="white" stroke-width="8"/>
  <circle cx="768" cy="256" r="8" fill="white"/>
</svg>